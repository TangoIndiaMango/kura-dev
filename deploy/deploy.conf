# Read by kura-server.sh on the server (not secret).
API_DOMAIN=api.kuramobility.com
# 127.0.0.1 port nginx forwards to (must be free on the server; SocialSpot uses 8090)
API_PORT=8101
# load the repo's starter data (roles, permissions, demo logins) into an EMPTY database only.
# The demo logins have public passwords: change them right after the first sign-in.
SEED_DEMO=yes
