# Read by kura-server.sh on the server (not secret).
API_DOMAIN=api.kuramobility.com
# 127.0.0.1 port nginx forwards to (must be free on the server; SocialSpot uses 8090)
API_PORT=8101
# yes = load DEMO data (fake riders, wallets, demo logins with public passwords) into an EMPTY
# database. Test servers only — never production. Roles and permissions load on every deploy anyway.
SEED_DEMO=no
# First super admin (production): set these for the first deploy, open the set-password link it
# prints (valid 72 hours), then clear ADMIN_EMAIL. Ignored once a super admin exists.
ADMIN_EMAIL=
ADMIN_FIRST_NAME=
ADMIN_LAST_NAME=
