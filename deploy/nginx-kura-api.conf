# Kura API behind the server's nginx (installed by kura-server.sh as
# /etc/nginx/sites-available/kura-api.conf). certbot adds the HTTPS parts.
# __API_DOMAIN__ and __API_PORT__ are filled in by kura-server.sh.

limit_req_zone $binary_remote_addr zone=kura_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;
    server_tokens off;

    client_max_body_size 25m;
    client_body_timeout 60s;
    client_header_timeout 15s;

    access_log /var/log/nginx/kura-api.access.log;
    error_log /var/log/nginx/kura-api.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/kura-acme;
        default_type text/plain;
    }

    location / {
        limit_req zone=kura_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # overwrite (not append): the API trusts the first hop, so a client can't fake it
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
