# Kura on the shared VPS (/opt/kura). Its own compose project, its own networks:
# nothing here touches the other projects on the server.
#   - db and redis have NO host ports: only the api and worker can reach them.
#   - the api listens on 127.0.0.1 only; the server's nginx is the public door.
#   - migrations run on every start; the starter seed only loads into an empty database (deploy.conf SEED_DEMO).
name: kura

x-app: &app
  image: kura-api:latest
  env_file: production.env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    MEDIA_ROOT: /app/media
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  volumes:
    - media:/app/media
  networks: [internal, outside]
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres -c shared_buffers=256MB -c effective_cache_size=768MB
      -c max_connections=60 -c log_min_duration_statement=500
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped
    shm_size: 256mb
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  api:
    <<: *app
    build:
      context: ./src/backend
    command: ["/bin/sh", "-c", "/app/migrate up && exec /app/api"]
    ports:
      - "127.0.0.1:${API_PORT:-8101}:8000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/media
      PORT: "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    <<: *app
    command: ["/app/worker"]
    healthcheck:
      disable: true
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  media:

networks:
  internal:
    internal: true
  outside:
