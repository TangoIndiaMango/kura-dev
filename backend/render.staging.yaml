# Render Blueprint — Go backend STAGING (separate database; live Django untouched).
# Render → New → Blueprint → this repo, branch go-backend,
# Blueprint file path: backend/render.staging.yaml
# Secrets marked `sync: false` are asked for in Render's form, never stored in git.

databases:
  - name: kura-staging-db
    databaseName: kura
    user: kura
    plan: basic-256mb
    region: frankfurt

envVarGroups:
  - name: kura-go-staging
    envVars:
      - key: KURA_ENV
        value: staging            # same safety rules as production (debug off, no dev NUBANs)
      - key: DJANGO_SECRET_KEY    # signs JWTs; staging gets its own
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: QR_HMAC_PEPPER
        generateValue: true
      - key: RECEIPT_SIGNING_SECRET
        generateValue: true
      # Paystack TEST mode for staging
      - key: DEFAULT_PSP
        value: PAYSTACK
      - key: PAYSTACK_SECRET_KEY  # sk_test_...
        sync: false
      - key: PAYSTACK_PREFERRED_BANK
        value: test-bank          # Paystack test-mode bank for dedicated accounts
      - key: PSP_CUSTOMER_EMAIL_DOMAIN
        value: customers.kura.eco
      # Media (Cloudinary) — same account is fine; staging uploads land in their own folder
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: kura-staging
      # Email
      - key: EMAIL_ENABLED
        value: "true"
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_USE_SSL
        value: "true"
      - key: EMAIL_USE_TLS
        value: "false"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD    # Gmail app password
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Frontend links in emails + browsers allowed to call the API
      - key: FRONTEND_ADMIN_URL
        sync: false
      - key: FRONTEND_CLIENT_URL
        sync: false
      - key: CORS_ORIGINS           # comma-separated staging frontend origins
        sync: false

services:
  - type: web
    name: kura-go-api-staging
    runtime: docker
    branch: go-backend
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      - fromGroup: kura-go-staging
      - key: DATABASE_URL
        fromDatabase:
          name: kura-staging-db
          property: connectionString

  - type: worker
    name: kura-go-worker-staging
    runtime: docker
    branch: go-backend
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /app/worker
    plan: starter
    region: frankfurt
    autoDeploy: true
    envVars:
      - fromGroup: kura-go-staging
      - key: DATABASE_URL
        fromDatabase:
          name: kura-staging-db
          property: connectionString
