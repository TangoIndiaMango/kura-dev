<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Theme before first paint: saved choice, else the system setting. -->
    <script>
      (function () {
        var t
        try { t = localStorage.getItem('kura-theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      })()
    </script>
    <!--app-head-->
    <meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14181b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta property="og:site_name" content="KURA Mobility" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:image" content="/images/kura-rider-640.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap"
    />
    <link rel="preload" as="image" type="image/avif" href="/images/okada-riders-640.avif" />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <noscript>
      <p style="padding:1rem;font-family:sans-serif">
        KURA Mobility — 60-second EV battery swaps in Lagos. Turn on JavaScript to see live hubs and prices.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
